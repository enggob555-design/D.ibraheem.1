<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الإعلانات - عيادتي الأدمن</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex items-center justify-between bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white font-black text-xl">ع</div>
                <div>
                    <h1 class="text-lg font-bold text-white">لوحة الإعلانات المركزية 📢</h1>
                    <p class="text-xs text-slate-400">توجيه البنرات الترويجية والعروض للأطباء في لوحة التحكم</p>
                </div>
            </div>
            <a href="./admin-subscriptions.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl transition font-semibold">العودة للاشتراكات</a>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-sm font-bold text-teal-400 mb-2">✨ إضافة إعلان ترويجي جديد للمنصة</h2>
            <form id="ads-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">عنوان الإعلان (Title)</label>
                    <input type="text" id="ad-title" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm outline-none text-white placeholder-slate-500" placeholder="مثال: خصم 50% على تجديد الاشتراك السنوي">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">رابط البنرات الإعلاني (Image URL)</label>
                    <input type="url" id="ad-image" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-left outline-none text-white placeholder-slate-500" dir="ltr" placeholder="https://example.com/banner.jpg">
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md cursor-pointer">📢 نشر الإعلان سحابياً</button>
            </form>
        </div>
    </div>

    <script>
        // الحماية الأمنية المخصصة للسوبر أدمن فقط
        async function checkAdminSecurity() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = "./index.html"; return; }

            const { data: userRole } = await supabase.from('user_roles').select('role').eq('user_id', session.user.id).single();
            if (!userRole || userRole.role !== 'super_admin') {
                alert("🛑 صلاحيات غير كافية! مخصص للمشرفين فقط.");
                window.location.href = "./index.html";
            }
        }

        document.getElementById('ads-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("🎉 تم محاكاة رفع الإعلان بنجاح، الجداول محمية وجاهزة للربط الكامل!");
        });

        checkAdminSecurity();
    </script>
</body>
</html>
