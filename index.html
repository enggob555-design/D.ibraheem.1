<script>
    // استبدل كود عرض الرقم بهذا الكود
    async function fetchData() {
        const { data, error } = await window.supabase.from('user_roles').select('*');
        if (data) {
            let table = `<table border="1" style="width:100%; text-align:center;">
                            <tr><th>ID</th><th>الدور (Role)</th></tr>`;
            data.forEach(row => {
                table += `<tr><td>${row.id}</td><td>${row.role_name}</td></tr>`;
            });
            table += `</table>`;
            document.getElementById('data-container').innerHTML = table;
        }
    }
    fetchData();
</script>
