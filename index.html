    <div id="status" style="text-align: center; margin-top: 50px; font-size: 20px;">جاري الاتصال...</div>

    <script>
        // 1. ضع رابط مشروعك هنا

        // 2. ضع مفتاح الـ anon الخاص بك هنا (الذي يبدأ بـ eyJ...)
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRweXNodWhpbnFueGhhcWZkeWtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4Mzc4ODQsImV4cCI6MjA5NjQxMzg4NH0.TpHanzVxjMEOJM0P3Oioic_odTmp7JJ-fFzBblOJVs0";

        // 3. إنشاء العميل
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 4. اختبار الاتصال
        async function testConnection() {
            const { data, error } = await supabase.from('user_roles').select('*').limit(1);

            if (error) {
                statusDiv.innerText = "❌ خطأ في الاتصال: " + error.message;
                statusDiv.style.color = "red";
            } else {
                statusDiv.innerText = "✅ تم الاتصال بنجاح بقاعدة البيانات!";
                statusDiv.style.color = "green";
            }
        }

        testConnection();
    </script>
