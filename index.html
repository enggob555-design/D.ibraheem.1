        const supabase = supabase.createClient(URL, KEY);

        async function checkConnection() {
            const statusDiv = document.getElementById('status');

                // محاولة الاتصال بجدول عام للتأكد من وصول السكريبت

                    statusDiv.innerText = "متصل سحابياً بنجاح 🟢";

                }
            } catch (err) {
                statusDiv.innerText = "خطأ فادح: " + err.message;
            }
        }
        checkConnection();
