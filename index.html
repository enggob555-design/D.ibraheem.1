<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادتي - بوابة الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="fixed top-4 right-4 flex items-center gap-2 bg-white px-3 py-1 rounded-full shadow-md border">
        <div id="status-light" class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <span id="status-text" class="text-[10px] font-bold text-slate-600">جاري التحقق...</span>
    </div>

    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-blue-600">عيادتي</h1>
            <p class="text-slate-400 text-sm">نظام إدارة العيادات الذكي</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full p-3 mt-1 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <div class="relative">
                <label class="text-xs font-bold text-slate-500">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 mt-1 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                <button type="button" onclick="togglePassword()" class="absolute left-3 top-9 text-slate-400 text-xs font-bold">عرض</button>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">تسجيل الدخول</button>
        </form>

        <div class="mt-6 text-center text-xs space-y-2 text-slate-500">
            <p>لا تملك حساباً؟ <a href="register.html" class="text-blue-600 font-bold">إنشاء عيادة جديدة</a></p>
            <p>نسيت كلمة المرور؟ <a href="reset-password.html" class="text-blue-600 font-bold">استعادة الوصول</a></p>
        </div>
    </div>

    <script>
        // 1. دالة تبديل رؤية كلمة المرور
        function togglePassword() {
            const field = document.getElementById('password');
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        // 2. تحديث مصباح الاتصال
        function updateOnlineStatus() {
            const light = document.getElementById('status-light');
            const text = document.getElementById('status-text');
            if (navigator.onLine) {
                light.className = "w-3 h-3 rounded-full bg-green-500";
                text.innerText = "متصل";
            } else {
                light.className = "w-3 h-3 rounded-full bg-red-500";
                text.innerText = "غير متصل";
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // 3. المنطق البرمجي لتسجيل الدخول والتوجيه حسب الرتبة
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // منع المتصفح من إعادة تحميل الصفحة عند إرسال النموذج
            const email = document.getElementById('email').value; // جلب الإيميل المدخل
            const password = document.getElementById('password').value; // جلب الباسورد المدخل
            const btn = document.getElementById('submit-btn');
            
            btn.innerText = "جاري التحقق...";
            btn.disabled = true;

            // محاولة تسجيل الدخول عبر Supabase
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("خطأ: " + error.message);
                btn.innerText = "تسجيل الدخول";
                btn.disabled = false;
                return;
            }

            // استعلام رتبة المستخدم من جدول user_roles
            const { data: userRole } = await supabase
                .from('user_roles')
                .select('role')
                .eq('user_id', data.user.id)
                .single();

            // منطق التوجيه الذكي (Routing)
            const role = userRole?.role;
            if (role === 'super_admin') window.location.href = "./admin-ads.html";
            else if (role === 'admin_assistant') window.location.href = "./admin-subscriptions.html";
            else if (role === 'ads_agent') window.location.href = "./ads.html";
            else if (role === 'doctor' || role === 'secretary') window.location.href = "./dashboard.html";
            else alert("ليس لديك رتبة محددة، تواصل مع الإدارة.");
        });
    </script>
</body>
</html>
