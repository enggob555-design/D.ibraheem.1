<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الموحد - منصة العيادتي الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-linear-to-br from-blue-600 to-indigo-700 rounded-2xl flex items-center justify-center text-white font-black text-3xl shadow-md shadow-blue-500/20 tracking-wider mx-auto">Dr</div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">بوابة تسجيل الدخول الموحدة</h1>
            <p class="text-xs text-slate-400">النظام الذكي للتحقق من الرتب الخمسة المعتمدة وتوجيه حسابك</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني (Email)</label>
                <input type="email" id="email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="user@platform.com">
            </div>
            
            <div class="relative">
    <label class="block text-xs font-semibold text-slate-500 mb-1.5">كلمة المرور (Password)</label>
<input type="password" id="password" required class="w-full p-3 pr-10 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="••••••••">

    <span id="togglePassword" class="absolute left-3 top-3.5 cursor-pointer text-slate-400 hover:text-blue-600">

        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path id="eye-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
    </span>
</div>


            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-xs shadow-xs transition cursor-pointer flex items-center justify-center gap-2">
                <span>🔑 تسجيل الدخول والنظام</span>
            </button>
        </form>

     <script>
    // 1. منطق تسجيل الدخول
    const loginForm = document.getElementById('login-form');
    const alertMessage = document.getElementById('alert-message');
    const submitBtn = document.getElementById('submit-btn');

    // دالة التوجيه (نُفعلها الآن)
    async function redirectUserByRole(userId) {
        submitBtn.disabled = true;
        submitBtn.innerText = "🔄 جاري التوجيه...";
        const { data: userRole, error } = await supabase.from('user_roles').select('role').eq('user_id', userId).single();
        if (error || !userRole) {
            window.location.href = "./dashboard.html";
            return;
        }
        window.location.href = (userRole.role === 'doctor' || userRole.role === 'secretary') ? "./dashboard.html" : "./admin-ads.html";
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const { data, error } = await supabase.auth.signInWithPassword({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        });
        if (error) {
            alertMessage.innerText = "⚠️ " + error.message;
            alertMessage.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            alertMessage.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-100');
        } else {
            redirectUserByRole(data.user.id);
        }
    });

    // 2. مؤشر الاتصال الموحد
    async function checkConnection() {
        const dot = document.getElementById('conn-dot');
        const text = document.getElementById('conn-text');
        try {
            const { error } = await supabase.from('user_roles').select('id').limit(1);
            if (error) throw error;
            dot.className = "w-2 h-2 rounded-full bg-emerald-500";
            text.innerText = "متصل سحابياً";
        } catch (err) {
            dot.className = "w-2 h-2 rounded-full bg-rose-500";
            text.innerText = "فشل الاتصال";
        }
    }
    window.addEventListener('load', checkConnection);

    // 3. منطق أيقونة العين
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');
    const eyePath = document.getElementById('eye-path');
    togglePassword.addEventListener('click', () => {
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
    });
</script>

<div id="conn-indicator" class="fixed top-4 left-4 flex items-center gap-2 bg-white px-2 py-1 rounded-full shadow-sm border border-slate-100 z-50">
    <div id="conn-dot" class="w-2 h-2 rounded-full bg-slate-300"></div>
    <span id="conn-text" class="text-[9px] font-bold text-slate-400">جاري الاتصال...</span>
</div>

 
</body>
</html>
