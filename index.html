<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - عيادتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
    <script src="./supabase-config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6 relative overflow-hidden">
        
        <div class="absolute top-4 left-4 flex items-center gap-1.5 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100 shadow-xs">
            <span id="db-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="db-status-text" class="text-[10px] font-bold text-slate-500">جاري فحص الربط...</span>
        </div>

        <div class="text-center space-y-2 pt-2">
            <div class="flex flex-col items-center justify-center gap-2">
                <div class="w-14 h-14 bg-linear-to-br from-teal-500 to-emerald-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-md shadow-teal-500/20">ع</div>
                <span class="text-2xl font-black bg-linear-to-r from-teal-600 to-emerald-600 bg-clip-text text-transparent tracking-tight">عيادتي</span>
            </div>
            <p class="text-xs text-slate-400">نظام التحقق الذكي من الرتب وتوجيه الحسابات مركزيتًّاً</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border transition-all duration-300"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني (Email)</label>
                <input type="email" id="email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="user@platform.com">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">كلمة المرور (Password)</label>
                <div class="relative flex items-center">
                    <input type="password" id="password" required class="w-full p-3 pl-12 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="••••••••">
                    <button type="button" id="toggle-password-btn" class="absolute left-3 text-slate-400 hover:text-slate-600 p-2 text-sm cursor-pointer select-none transition z-10">
                        👁️
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs px-1">
                <label class="flex items-center gap-2 text-slate-500 font-semibold cursor-pointer select-none">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 rounded-md border-slate-300 text-teal-600 focus:ring-teal-500">
                    <span>تذكرني</span>
                </label>
                <a href="./reset-password.html" class="text-teal-600 hover:underline font-semibold">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl text-xs shadow-xs transition flex items-center justify-center gap-2 cursor-pointer">
                <span>🔑 تسجيل الدخول الآمن</span>
            </button>
        </form>
    </div>

    <script>
        // دالة التأكد من الاتصال
        setTimeout(async () => {
            try {
                const { error } = await supabase.from('user_roles').select('role').limit(1);
                if (!error) {
                    document.getElementById('db-status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                    document.getElementById('db-status-text').innerText = "متصل سحابياً 🟢";
                }
            } catch (e) {
                document.getElementById('db-status-dot').className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                document.getElementById('db-status-text').innerText = "خطأ في الاتصال 🔴";
            }
        }, 1500);

        // منطق تسجيل الدخول
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "⏳ جاري التحقق...";
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            if (error) {
                alert("خطأ في البيانات: " + error.message);
                btn.innerText = "🔑 تسجيل الدخول الآمن";
            } else {
                const { data: roleData } = await supabase.from('user_roles').select('role').eq('user_id', data.user.id).single();
                window.location.href = roleData?.role === 'super_admin' ? "./admin-subscriptions.html" : "./dashboard.html";
            }
        });

        // إظهار وإخفاء كلمة المرور
        document.getElementById('toggle-password-btn').addEventListener('click', () => {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>
</html>
