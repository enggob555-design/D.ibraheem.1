        const loginForm = document.getElementById('login-form');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');

        function showAlert(message, type = 'error') {
            alertMessage.innerText = message;
            alertMessage.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-100', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            if (type === 'error') {
                alertMessage.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-100');
            } else {
                alertMessage.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            }
            alertMessage.classList.remove('hidden');
        }

        async function checkExistingSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) { redirectUserByRole(session.user.id); }
        }

        async function redirectUserByRole(userId) {
            submitBtn.disabled = true;
            submitBtn.innerText = "🔄 جاري فحص الرتبة وتوجيهك بأمان...";

            const { data: userRole, error } = await supabase.from('user_roles').select('role').eq('user_id', userId).single();

            if (error || !userRole) {
                const { data: isDoc } = await supabase.from('clinics').select('id').eq('id', userId).single();
                if(isDoc) {
                    window.location.href = "./dashboard.html";
                } else {
                    showAlert("⚠️ لم يتم تعيين رتبة صالحة لهذا الحساب في النظام. اتصل بالمالك الفني.", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
                }
                return;
            }

            switch (userRole.role) {
                case 'super_admin':
                    window.location.href = "./admin-ads.html";
                    break;
                case 'assistant_admin':
                    window.location.href = "./admin-ads.html";
                    break;
                case 'doctor':
                    window.location.href = "./dashboard.html";
                    break;
                case 'secretary':
                    window.location.href = "./dashboard.html"; 
                    break;
                case 'ads_agent':
                    window.location.href = "./admin-ads.html";
                    break;
                default:
                    showAlert("رتبة الحساب غير معروفة برمجياً.", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ جاري التحقق من الهوية سحابياً...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showAlert("⚠️ خطأ في الدخول: " + error.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
            } else {
                showAlert("🎉 تم التحقق! جاري فحص الصلاحيات...", "success");
                redirectUserByRole(data.user.id);
            }
        });

    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');
    const eyePath = document.getElementById('eye-path');

    togglePassword.addEventListener('click', () => {
        // تبديل نوع الحقل
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);

        // تغيير شكل الأيقونة (اختياري: إظهار خط مائل عند الإخفاء)
        eyePath.setAttribute('d', type === 'password'
