<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع عيادتي</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
    <div id="status" style="text-align: center; margin-top: 50px; font-size: 20px;">جاري الفحص...</div>

    <script>
        // التأكد من تحميل المكتبة
        if (typeof supabase === 'undefined') {
            document.getElementById('status').innerText = "❌ فشل تحميل المكتبة (تحقق من اتصالك)";
            document.getElementById('status').style.color = "red";
        } else {
            const SUPABASE_URL = "https://dpyshuhinqnxhaqfdykl.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRweXNodWhpbnFueGhhcWZkeWtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4Mzc4ODQsImV4cCI6MjA5NjQxMzg4NH0.TpHanzVxjMEOJM0P3Oioic_odTmp7JJ-fFzBblOJVs0";

            const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            client.from('user_roles').select('*').limit(1)
            .then(({ data, error }) => {
                if (error) {
                    document.getElementById('status').innerText = "❌ خطأ قاعدة بيانات: " + error.message;
                    document.getElementById('status').style.color = "red";
                } else {
                    document.getElementById('status').innerText = "✅ تم الاتصال بنجاح بقاعدة البيانات!";
                    document.getElementById('status').style.color = "green";
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = "❌ خطأ غير متوقع: " + err;
            });
        }
    </script>
</body>
</html>
