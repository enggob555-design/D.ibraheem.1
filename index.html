<!DOCTYPE html> <html lang="ar" dir="rtl"> <head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>عيادتي - بوابة الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script> <script src="supabase-config.js"></script> </head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4"> <div class="fixed top-4 right-4 flex items-center gap-2 bg-white px-3 py-1 rounded-full shadow-md border border-slate-100">
        <div id="status-light" class="w-3 h-3 rounded-full bg-yellow-500"></div> <span id="status-text" class="text-[10px] font-bold text-slate-600">جاري التحقق...</span> </div>

    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl"> <div class="text-center mb-8"> <h1 class="text-3xl font-black text-blue-600">عيادتي</h1>
        </div>

        <form id="login-form" class="space-y-4"> <div>
                <label class="text-xs font-bold text-slate-500">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full p-3 mt-1 border rounded-xl text-sm"> </div>

            <div class="relative"> <label class="text-xs font-bold text-slate-500">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 mt-1 border rounded-xl text-sm">
                <button type="button" onclick="togglePassword()" class="absolute left-3 top-9 text-slate-400 text-xs font-bold">عرض</button>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        // دالة تبديل رؤية كلمة المرور
        function togglePassword() {
            const field = document.getElementById('password'); // جلب عنصر حقل الباسورد
            // إذا كان النوع "password" حوله لـ "text" وإلا اعكسه
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        // مراقبة حالة الإنترنت
        const statusLight = document.getElementById('status-light'); // جلب عنصر الدائرة
        const statusText = document.getElementById('status-text'); // جلب عنصر النص

        function updateOnlineStatus() {
            // navigator.onLine خاصية في المتصفح تعطي true إذا كان هناك إنترنت
            if (navigator.onLine) {
                statusLight.className = "w-3 h-3 rounded-full bg-green-500"; // تغيير اللون للأخضر
                statusText.innerText = "متصل";
            } else {
                statusLight.className = "w-3 h-3 rounded-full bg-red-500"; // تغيير اللون للأحمر
                statusText.innerText = "غير متصل";
            }
        }
        window.addEventListener('online', updateOnlineStatus); // الاستماع لحدث عودة الإنترنت
        window.addEventListener('offline', updateOnlineStatus); // الاستماع لحدث انقطاع الإنترنت
        updateOnlineStatus(); // تنفيذ الدالة فور تحميل الصفحة

        // منطق تسجيل الدخول
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // منع المتصفح من إرسال النموذج بالطريقة التقليدية
            const email = document.getElementById('email').value; // جلب قيمة الإيميل
            const password = document.getElementById('password').value; // جلب قيمة الباسورد
            
            // التواصل مع Supabase
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("خطأ: " + error.message); // في حال وجود خطأ في البيانات
                return;
            }

            // بعد نجاح الدخول، جلب الرتبة من قاعدة البيانات
            const { data: userRole } = await supabase.from('user_roles').select('role').eq('user_id', data.user.id).single();

            // التحقق من الرتبة وتوجيه المستخدم
            if (userRole?.role === 'super_admin') {
                window.location.href = "./admin-ads.html"; // توجيه الأدمن
            } else {
                window.location.href = "./dashboard.html"; // توجيه الطبيب/السكرتير
            }
        });
    </script>
</body>
</html>
