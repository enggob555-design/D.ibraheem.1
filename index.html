<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص الاتصال</title>
</head>
<body>
    <div id="log" style="font-family: sans-serif; padding: 20px;">جاري الفحص...</div>

    <script>
        const log = document.getElementById('log');
        const URL = "https://dpyshuhinqnxhaqfdykl.supabase.co/rest/v1/";
        
        // محاولة الاتصال المباشر بدون مكتبة سوبابيس (عبر fetch)
        fetch(URL, {
            headers: {
                'apikey': 'ضع_هنا_الـ_Anon_Key_الخاص_بمشروع_my_job',
                'Authorization': 'Bearer 'ضع_هنا_الـ_Anon_Key_الخاص_بمشروع_my_job''
            }
        })
        .then(response => {
            if (response.ok) {
                log.innerHTML = "<h1 style='color:green;'>الاتصال ناجح 🟢</h1>";
            } else {
                log.innerHTML = "<h1 style='color:red;'>خطأ في الاتصال: " + response.status + "</h1>";
            }
        })
        .catch(err => {
            log.innerHTML = "<h1 style='color:red;'>فشل الوصول للسيرفر: " + err + "</h1>";
        });
    </script>
</body>
</html>
