<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - عيادتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
        
        <div class="flex items-center justify-center gap-2 mb-4">
            <span id="db-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="db-status-text" class="text-[10px] font-bold text-slate-500">جاري التأكد من الاتصال...</span>
        </div>

        <div class="text-center">
            <h1 class="text-2xl font-black text-teal-700">عيادتي</h1>
            <p class="text-xs text-slate-400 mt-1">نظام الإدارة المركزية</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full p-3 border rounded-xl text-sm" dir="ltr" placeholder="user@clinic.com">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">كلمة المرور</label>
                <div class="relative flex items-center">
                    <input type="password" id="password" required class="w-full p-3 border rounded-xl text-sm" dir="ltr" placeholder="••••••••">
                    <button type="button" id="toggle-password-btn" class="absolute left-3 text-slate-400 hover:text-teal-600 transition">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl text-sm transition">
                🔑 تسجيل الدخول الآمن
            </button>
        </form>
    </div>

    <script>
        // 1. فحص الاتصال التلقائي
        async function checkConnection() {
            try {
                const { error } = await supabase.from('user_roles').select('id').limit(1);
                if (error) throw error;
                document.getElementById('db-status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                document.getElementById('db-status-text').innerText = "متصل بالسيرفر 🟢";
            } catch (e) {
                document.getElementById('db-status-dot').className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                document.getElementById('db-status-text').innerText = "فشل الاتصال 🔴";
            }
        }

        // 2. العين لإظهار كلمة المرور
        document.getElementById('toggle-password-btn').addEventListener('click', () => {
            const p = document.getElementById('password');
            p.type = (p.type === 'password') ? 'text' : 'password';
        });

        // 3. التوجيه الذكي
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "⏳ جاري التحقق...";
            btn.disabled = true;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            if (error) {
                alert("خطأ في البيانات: " + error.message);
                btn.innerText = "🔑 تسجيل الدخول الآمن";
                btn.disabled = false;
            } else {
                // جلب الرتبة وتوجيه المستخدم
                const { data: roleData } = await supabase.from('user_roles').select('role').eq('user_id', data.user.id).single();
                
                if (roleData?.role === 'super_admin') {
                    window.location.href = "./admin-subscriptions.html";
                } else if (roleData?.role === 'secretary') {
                    window.location.href = "./dashboard.html";
                } else {
                    alert("لا تملك صلاحيات كافية.");
                }
            }
        }

        document.getElementById('login-form').addEventListener('submit', handleLogin);
        setTimeout(checkConnection, 1000);
    </script>
</body>
</html>
