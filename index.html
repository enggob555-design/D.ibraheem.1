<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الموحد - منصة العيادة الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-linear-to-br from-blue-600 to-indigo-700 rounded-2xl flex items-center justify-center text-white font-black text-3xl shadow-md shadow-blue-500/20 tracking-wider mx-auto">Dr</div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">بوابة تسجيل الدخول الموحدة</h1>
            <p class="text-xs text-slate-400">النظام الذكي للتحقق من الرتب الخمسة المعتمدة وتوجيه حسابك</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني (Email)</label>
                <input type="email" id="email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="user@platform.com">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">كلمة المرور (Password)</label>
                <input type="password" id="password" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-xs shadow-xs transition cursor-pointer flex items-center justify-center gap-2">
                <span>🔑 تسجيل الدخول والنظام</span>
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-100 space-y-2">
            <p class="text-xs text-slate-500">حساب طبيب جديد؟ 
                <a href="./register.html" class="text-blue-600 hover:underline font-semibold">اضغط هنا لإنشاء العيادة</a>
            </p>
            <p class="text-[11px] text-slate-400">لإصدار حسابات الأدمن، السكرتارية، أو مناديب الإعلان، اتصل بـ 
                <a href="https://wa.me/9647702265652" target="_blank" class="text-emerald-600 font-bold hover:underline">السوبر أدمن الرئيسي</a>
            </p>
        </div>
    </div>

    <script>
        // الربط المباشر مع مشروعك بناءً على معلومات الـ ID الموثقة
        const SUPABASE_URL = "https://dpyshuhinqruhaqftydkl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_h0L6PY42fnjxfBjwAfh3Cw_Lr6zUgMO"; 
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('login-form');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');

        function showAlert(message, type = 'error') {
            alertMessage.innerText = message;
            alertMessage.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-100', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            if (type === 'error') {
                alertMessage.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-100');
            } else {
                alertMessage.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            }
            alertMessage.classList.remove('hidden');
        }

        async function checkExistingSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) { redirectUserByRole(session.user.id); }
        }

        async function redirectUserByRole(userId) {
            submitBtn.disabled = true;
            submitBtn.innerText = "🔄 جاري فحص الرتبة وتوجيهك بأمان...";

            const { data: userRole, error } = await supabase.from('user_roles').select('role').eq('user_id', userId).single();

            if (error || !userRole) {
                const { data: isDoc } = await supabase.from('clinics').select('id').eq('id', userId).single();
                if(isDoc) {
                    window.location.href = "./dashboard.html";
                } else {
                    showAlert("⚠️ لم يتم تعيين رتبة صالحة لهذا الحساب في النظام. اتصل بالمالك الفني.", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
                }
                return;
            }

            switch (userRole.role) {
                case 'super_admin':
                    window.location.href = "./admin-ads.html";
                    break;
                case 'assistant_admin':
                    window.location.href = "./admin-ads.html";
                    break;
                case 'doctor':
                    window.location.href = "./dashboard.html";
                    break;
                case 'secretary':
                    window.location.href = "./dashboard.html"; 
                    break;
                case 'ads_agent':
                    window.location.href = "./admin-ads.html";
                    break;
                default:
                    showAlert("رتبة الحساب غير معروفة برمجياً.", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ جاري التحقق من الهوية سحابياً...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showAlert("⚠️ خطأ في الدخول: " + error.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
            } else {
                showAlert("🎉 تم التحقق! جاري فحص الصلاحيات...", "success");
                redirectUserByRole(data.user.id);
            }
        });

        checkExistingSession();
    </script>
</body>
</html>
