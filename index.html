<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - عيادتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
        <div class="text-center space-y-4">
            <h1 class="text-2xl font-black text-teal-700">عيادتي</h1>
            <div id="status" class="text-xs font-bold text-slate-400">جاري فحص الاتصال...</div>
        </div>

        <form id="login-form" class="space-y-4 mt-6">
            <input type="email" id="email" required placeholder="البريد الإلكتروني" class="w-full p-3 border rounded-xl text-sm" dir="ltr">
            <input type="password" id="password" required placeholder="كلمة المرور" class="w-full p-3 border rounded-xl text-sm" dir="ltr">
            <button type="submit" id="submit-btn" class="w-full bg-teal-600 text-white py-3 rounded-xl text-sm font-bold">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        // إعدادات الاتصال (يرجى التأكد من تطابقها مع لوحة تحكم سوبابيس)
        const SUPABASE_URL = "https://dpyshuhinqnxhaqfdykl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRweXNodWhpbnFueGhhcWZkeWtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4Mzc4ODQsImV4cCI6MjA5NjQxMzg4NH0.TpHanzVxjMEOJM0P3Oioic_odTmp7JJ-fFzBblOJVs0";
        
        // تهيئة العميل
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // فحص الاتصال
        async function init() {
            const statusDiv = document.getElementById('status');
            try {
                const { data, error } = await supabase.from('user_roles').select('*').limit(1);
                if (error) throw error;
                statusDiv.innerText = "متصل بنجاح 🟢";
                statusDiv.classList.add("text-emerald-600");
            } catch (err) {
                statusDiv.innerText = "خطأ في الاتصال 🔴";
                statusDiv.classList.add("text-rose-600");
                console.error(err);
            }
        }

        // معالجة الدخول
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "جاري الدخول...";
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            if (error) {
                alert("خطأ: " + error.message);
                btn.innerText = "تسجيل الدخول";
            } else {
                alert("تم الدخول بنجاح!");
                window.location.reload();
            }
        });

        init();
    </script>
</body>
</html>
