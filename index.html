<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الموحد - منصة العيادة الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-linear-to-br from-blue-600 to-indigo-700 rounded-2xl flex items-center justify-center text-white font-black text-3xl shadow-md shadow-blue-500/20 tracking-wider mx-auto">Dr</div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">بوابة تسجيل الدخول الموحدة</h1>
            <p class="text-xs text-slate-400">النظام الذكي للتحقق من الرتب الخمسة المعتمدة وتوجيه حسابك</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border"></div>

        <div class="grid grid-cols-2 gap-3">
            <button type="button" id="google-login-btn" class="flex items-center justify-center gap-2 border border-slate-200 hover:bg-slate-50 p-2.5 rounded-xl text-xs font-bold transition cursor-pointer shadow-xs">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.11C18.432 2.02 15.61 1 12.24 1 5.922 1 12 5.922 1 12s4.922 11 11.24 11c6.596 0 10.983-4.63 10.983-11.173 0-.753-.08-1.334-.177-1.827H12.24z"/>
                </svg>
                <span>Google</span>
            </button>
            
            <button type="button" id="apple-login-btn" class="flex items-center justify-center gap-2 border border-slate-200 hover:bg-slate-50 p-2.5 rounded-xl text-xs font-bold transition cursor-pointer shadow-xs">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.39z"/>
                </svg>
                <span>Apple ID</span>
            </button>
        </div>

        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-100"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-[10px] uppercase tracking-wider font-bold">أو بالطريقة الاعتيادية</span>
            <div class="flex-grow border-t border-slate-100"></div>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني (Email)</label>
                <input type="email" id="email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="user@platform.com">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">كلمة المرور (Password)</label>
                <div class="relative flex items-center">
                    <input type="password" id="password" required class="w-full p-3 pl-12 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="••••••••">
                    <button type="button" id="toggle-password-btn" class="absolute left-3 text-slate-400 hover:text-slate-600 p-1 text-sm cursor-pointer select-none transition">👁️</button>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-xs shadow-xs transition cursor-pointer flex items-center justify-center gap-2">
                <span>🔑 تسجيل الدخول والنظام</span>
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-100 space-y-2">
            <p class="text-xs text-slate-500">حساب طبيب جديد؟ 
                <a href="./register.html" class="text-blue-600 hover:underline font-semibold">اضغط هنا لإنشاء العيادة</a>
            </p>
            <p class="text-[11px] text-slate-400">لإصدار وتفعيل الحسابات المعلقة، اتصل بـ 
                <a href="https://wa.me/9647702265652" target="_blank" class="text-emerald-600 font-bold hover:underline">السوبر أدمن الرئيسي</a>
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dpyshuhinqruhaqftydkl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_h0L6PY42fnjxfBjwAfh3Cw_Lr6zUgMO"; 
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('login-form');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.innerText = '🔒';
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.innerText = '👁️';
            }
        });

        function showAlert(message, type = 'error') {
            alertMessage.innerText = message;
            alertMessage.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-100', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-100', 'bg-amber-50', 'text-amber-700', 'border-amber-100');
            if (type === 'error') {
                alertMessage.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-100');
            } else if (type === 'coming_soon') {
                alertMessage.classList.add('bg-amber-50', 'text-amber-700', 'border-amber-100');
            } else {
                alertMessage.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            }
            alertMessage.classList.remove('hidden');
        }

        // 🧠 ربط أزرار Google و Apple برسالة التنبيه التسويقية (قريباً)
        document.getElementById('google-login-btn').addEventListener('click', () => {
            showAlert("🚀 ميزة الربط المباشر بحساب Google ستكون متاحة في التحديث القادم حياً! يرجى التسجيل بالبريد حالياً.", "coming_soon");
        });

        document.getElementById('apple-login-btn').addEventListener('click', () => {
            showAlert("🍏 ميزة الربط السريع بـ Apple ID قيد المراجعة الفنية وستطلق قريباً جداً!", "coming_soon");
        });

        async function checkExistingSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) { redirectUserByRole(session.user.id); }
        }

        async function redirectUserByRole(userId) {
            submitBtn.disabled = true;
            submitBtn.innerText = "🔄 جاري فحص رتبة الحساب...";

            const { data: userRole, error } = await supabase.from('user_roles').select('role').eq('user_id', userId).single();

            if (error || !userRole) {
                const { data: isDoc } = await supabase.from('clinics').select('id, subscription_status').eq('id', userId).single();
                
                if(isDoc && isDoc.subscription_status !== 'expired') {
                    window.location.href = "./dashboard.html";
                } else {
                    showAlert("⚠️ الحساب مسجل بنجاح، لكنه بانتظار التفعيل الفني والترخيص من قبل الإدارة. يرجى مراسلة المالك لتفعيل العيادة.", "error");
                    await supabase.auth.signOut(); 
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
                }
                return;
            }

            switch (userRole.role) {
                case 'super_admin': window.location.href = "./admin-ads.html"; break;
                case 'assistant_admin': window.location.href = "./admin-ads.html"; break;
                case 'doctor': window.location.href = "./dashboard.html"; break;
                case 'secretary': window.location.href = "./dashboard.html"; break;
                case 'ads_agent': window.location.href = "./admin-ads.html"; break;
                default:
                    showAlert("رتبة الحساب غير مدعومة سيادياً.", "error");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ جاري فحص الهوية سحابياً...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showAlert("⚠️ خطأ في تسجيل الدخول: " + error.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerText = "🔑 تسجيل الدخول والنظام";
            } else {
                showAlert("🎉 تم التحقق! جاري فحص صلاحيات التفعيل...", "success");
                redirectUserByRole(data.user.id);
            }
        });

        checkExistingSession();
    </script>
</body>
</html>
