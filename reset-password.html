<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - عيادتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="flex flex-col items-center justify-center gap-2">
                <div class="w-14 h-14 bg-linear-to-br from-teal-500 to-emerald-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-md shadow-teal-500/20">ع</div>
                <span class="text-2xl font-black bg-linear-to-r from-teal-600 to-emerald-600 bg-clip-text text-transparent tracking-tight">عيادتي</span>
            </div>
            <h2 class="text-base font-bold text-slate-700 mt-2">نسيت كلمة المرور؟</h2>
            <p class="text-xs text-slate-400">أدخل بريدك الإلكتروني لإرسال رابط تصفير الأمان</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border transition-all duration-300"></div>

        <form id="reset-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني المسجل</label>
                <input type="email" id="reset-email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left placeholder-slate-300" dir="ltr" placeholder="doctor@myclinic.com">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl text-xs transition cursor-pointer">
                🚀 إرسال رابط الاستعادة السحابي
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="./index.html" class="text-xs text-teal-600 hover:underline font-bold">العودة لصفحة تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById('reset-form');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ جاري إرسال الطلب...";
            alertMessage.classList.add('hidden');

            const email = document.getElementById('reset-email').value.trim();

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/index.html',
            });

            if (error) {
                alertMessage.innerText = "⚠️ تعذر إرسال الطلب: " + error.message;
                alertMessage.className = "text-xs font-semibold p-3.5 rounded-xl border bg-rose-50 text-rose-700 border-rose-100";
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 إرسال رابط الاستعادة السحابي";
            } else {
                alertMessage.innerText = "🎉 تم إرسال رابط الاستعادة إلى بريدك الإلكتروني بنجاح! تفقد البريد الوارد.";
                alertMessage.className = "text-xs font-semibold p-3.5 rounded-xl border bg-emerald-50 text-emerald-700 border-emerald-100";
            }
            alertMessage.classList.remove('hidden');
        });
    </script>
</body>
</html>
