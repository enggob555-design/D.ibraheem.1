<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة الرمز - عيادتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6 relative overflow-hidden">
        
        <div class="absolute top-4 left-4 flex items-center gap-1.5 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100 shadow-xs">
            <span id="db-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="db-status-text" class="text-[10px] font-bold text-slate-500">جاري فحص الربط...</span>
        </div>

        <div class="text-center space-y-2 pt-2">
            <div class="flex items-center justify-center gap-2">
                <span class="text-2xl font-black bg-linear-to-r from-teal-600 to-emerald-600 bg-clip-text text-transparent tracking-tight">عيادتي</span>
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">استعادة الرمز السري</h1>
            <p class="text-xs text-slate-400">أدخل بريدك الإلكتروني لإرسال رابط تعيين آمن</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border"></div>

        <form id="reset-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني (Email)</label>
                <input type="email" id="reset-email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="user@platform.com">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl text-xs shadow-xs transition cursor-pointer">
                <span>📨 إرسال رابط التغيير للإيميل</span>
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="./index.html" class="text-xs text-teal-600 hover:underline font-semibold">⬅️ العودة لصفحة تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dpyshuhinqruhaqftydkl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRweXNodWhpbnFydWhhcWZ0eWRrbCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzE2ODAyMTgyLCJleHAiOjIwMzIzNzgxODJ9.h0L6PY42fnjxfBjwAfh3Cw_Lr6zUgMO"; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const resetForm = document.getElementById('reset-form');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');
        const statusDot = document.getElementById('db-status-dot');
        const statusText = document.getElementById('db-status-text');

        async function testDatabaseConnection() {
            try {
                const { error } = await supabase.from('user_roles').select('role').limit(1);
                if (error && error.message.includes("apiKey")) throw new Error();
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-xs shadow-emerald-500/50";
                statusText.innerText = "متصل سحابياً 🟢";
                statusText.className = "text-[10px] font-bold text-emerald-600";
            } catch (err) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 shadow-xs shadow-rose-500/50";
                statusText.innerText = "خطأ في الاتصال 🔴";
                statusText.className = "text-[10px] font-bold text-rose-600";
            }
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ جاري إرسال الطلب سحابياً...";

            const email = document.getElementById('reset-email').value.trim();

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/index.html',
            });

            alertMessage.classList.remove('hidden');
            if (error) {
                alertMessage.innerText = "⚠️ خطأ: البريد المدخل غير مسجل لدينا أو غير صحيح.";
                alertMessage.className = "text-xs font-semibold p-3.5 rounded-xl border bg-rose-50 text-rose-700 border-rose-100";
                submitBtn.disabled = false;
                submitBtn.innerText = "📨 إرسال رابط التغيير للإيميل";
            } else {
                alertMessage.innerText = "🎉 تم إرسال رابط إعادة تعيين كلمة المرور بنجاح! تفقد بريدك الإلكتروني الآن.";
                alertMessage.className = "text-xs font-semibold p-3.5 rounded-xl border bg-emerald-50 text-emerald-700 border-emerald-100";
            }
        });

        testDatabaseConnection();
    </script>
</body>
</html>
