<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - منصة العيادة الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">استعادة الرمز السري</h1>
            <p class="text-xs text-slate-400">أدخل بريدك الإلكتروني المعتمد لإرسال رابط إعادة التعيين الآمن</p>
        </div>

        <div id="alert-message" class="hidden text-xs font-semibold p-3.5 rounded-xl border"></div>

        <form id="reset-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني (Email)</label>
                <input type="email" id="reset-email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none text-sm text-left" dir="ltr" placeholder="user@platform.com">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-xs shadow-xs transition cursor-pointer">
                <span>📨 إرسال رابط التغيير للإيميل</span>
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="./index.html" class="text-xs text-blue-600 hover:underline font-semibold">⬅️ العودة لصفحة تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dpyshuhinqruhaqftydkl.supabase.co";
        // ⬇️ ضع كود الـ anon الخاص بك بالكامل بين علامتي التنصيص أدناه
        const SUPABASE_ANON_KEY = "sb_publishable_h0L6PY42fnjxfBjwAfh3Cw_Lr6zUgMO"; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const resetForm = document.getElementById('reset-form');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');

        function showAlert(message, type = 'error') {
            alertMessage.innerText = message;
            alertMessage.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-100', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            if (type === 'error') { alertMessage.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-100'); }
            else { alertMessage.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-100'); }
            alertMessage.classList.remove('hidden');
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value.trim();
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ جاري إرسال الطلب سحابياً...";

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/index.html',
            });

            if (error) {
                showAlert("⚠️ خطأ: " + error.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerText = "📨 إرسال رابط التغيير للإيميل";
            } else {
                showAlert("🎉 تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني بنجاح! تفقد البريد الوارد أو المزعج (Spam).", "success");
            }
        });
    </script>
</body>
</html>
