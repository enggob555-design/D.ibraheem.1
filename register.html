<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طبيب جديد - منصة العيادات الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xs border border-slate-100 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-linear-to-br from-blue-600 to-indigo-700 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-md shadow-blue-500/20 mx-auto tracking-wider">
                Dr
            </div>
            <h1 class="text-xl font-bold text-slate-900 mt-4">تسجيل طبيب جديد</h1>
            <p class="text-xs text-slate-400">أنشئ حسابك الآن للانضمام إلى مجتمع الأطباء النشطين</p>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">الاسم الكامل (الدكتور/ة)</label>
                <input type="text" id="full-name" required class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition text-sm" placeholder="د. إبراهيم محمد">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition text-sm text-left" dir="ltr" placeholder="doctor@example.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition text-sm text-left" dir="ltr" placeholder="••••••••">
            </div>

            <button type="submit" id="register-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm cursor-pointer shadow-xs">
                إنشاء حساب جديد
            </button>
        </form>

        <div id="status-msg" class="text-center text-xs font-bold hidden bg-slate-50 p-3 rounded-xl border"></div>

        <div class="text-center pt-2 border-t border-slate-100">
            <a href="./index.html" class="text-xs text-blue-600 font-semibold hover:underline">لديك حساب بالفعل؟ سجل الدخول</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dpyshuhinqruhaqftydkl.supabase.co";
        const SUPABASE_ANON_KEY = "ضع_مفتاح_ANON_الخاص_بمشروعك_هنا"; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('full-name').value;
            
            const statusMsg = document.getElementById('status-msg');
            const registerBtn = document.getElementById('register-btn');

            statusMsg.classList.add('hidden');
            registerBtn.disabled = true;
            registerBtn.innerText = "جاري إنشاء الحساب وبث البيانات...";

            // 1. تسجيل الطبيب في نظام الـ Auth الخاص بـ سوبابيس
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { display_name: fullName } // حفظ اسم الطبيب بداخل بيانات الـ Auth
                }
            });

            if (authError) {
                statusMsg.className = "text-center text-xs font-bold text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-100";
                statusMsg.innerText = "فشل التسجيل: " + authError.message;
                statusMsg.classList.remove('hidden');
                registerBtn.disabled = false;
                registerBtn.innerText = "إنشاء حساب جديد";
                return;
            }

            if (authData && authData.user) {
                // 2. إدخال بيانات الطبيب الإضافية في جدول عياداتك (clinics) وضبط حالته الافتراضية كـ (انتظار التفعيل)
                const { error: dbError } = await supabase.from('clinics').insert([{
                    id: authData.user.id, // ربط مباشر مع الـ Auth User ID
                    name: fullName,
                    subscription_status: 'trial', // أو 'pending' حسب رغبتك كصاحب سيرفر
                    subscription_expires_at: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString() // تفعيل تجريبي تلقائي لمدة 7 أيام مثلاً
                }]);

                if (dbError) {
                    statusMsg.className = "text-center text-xs font-bold text-amber-600 bg-amber-50 p-3 rounded-xl border border-amber-100";
                    statusMsg.innerText = "تم إنشاء الحساب، لكن فشل تحديث جدول العيادة: " + dbError.message;
                    statusMsg.classList.remove('hidden');
                } else {
                    statusMsg.className = "text-center text-xs font-bold text-emerald-600 bg-emerald-50 p-3 rounded-xl border border-emerald-100";
                    statusMsg.innerText = "🎉 تم تسجيل حسابك بنجاح! جاري تحويلك لصفحة الدخول...";
                    statusMsg.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = "./index.html"; // تحويل الطبيب لصفحة الدخول فوراً
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
