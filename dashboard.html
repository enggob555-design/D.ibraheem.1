<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - عيادتي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen p-6">

    <div class="max-w-5xl mx-auto space-y-6 relative">
        <div class="flex items-center justify-between bg-white p-6 rounded-2xl border border-slate-100 shadow-sm relative overflow-hidden">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-linear-to-br from-teal-500 to-emerald-600 rounded-xl flex items-center justify-center text-white font-black text-xl">ع</div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">لوحة تحكم العيادة - <span class="text-teal-600">عيادتي</span></h1>
                    <p class="text-xs text-slate-400">النظام الذكي لإدارة المهام والمواعيد الطبية</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                    <span id="db-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="db-status-text" class="text-[10px] font-bold text-slate-500">جاري التأمين...</span>
                </div>
                <button id="doc-logout-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition cursor-pointer">تسجيل خروج</button>
            </div>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm text-center text-slate-500 text-sm">
            🔄 جاري تحميل وتهيئة بيانات لوحة التحكم والربط السحابي مع قاعدة البيانات...
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dpyshuhinqruhaqftydkl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRweXNodWhpbnFydWhhcWZ0eWRrbCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzE2ODAyMTgyLCJleHAiOjIwMzIzNzgxODJ9.h0L6PY42fnjxfBjwAfh3Cw_Lr6zUgMO"; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusDot = document.getElementById('db-status-dot');
        const statusText = document.getElementById('db-status-text');

        async function checkDocAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { window.location.href = "./index.html"; return; }
                
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-xs shadow-emerald-500/50";
                statusText.innerText = "الداتا بيس آمنة 🟢";
                statusText.className = "text-[10px] font-bold text-emerald-600";
            } catch(e) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500/50";
                statusText.innerText = "خطأ اتصال 🔴";
            }
        }

        document.getElementById('doc-logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = "./index.html";
        });

        checkDocAuth();
    </script>
</body>
</html>
