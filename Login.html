<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة العيادات الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;750&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xs border border-slate-100 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-linear-to-br from-blue-600 to-indigo-700 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-md shadow-blue-500/20 mx-auto tracking-wider">
                Dr
            </div>
            <h1 class="text-xl font-bold text-slate-900 mt-4">تسجيل دخول الأطباء</h1>
            <p class="text-xs text-slate-400">أدخل بيانات حسابك المعتمدة للوصول إلى لوحة التحكم الفورية</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition text-sm text-left" dir="ltr" placeholder="doctor@example.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">كلمة المرور</label>
                <input type="password" id="password" required class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition text-sm text-left" dir="ltr" placeholder="••••••••">
            </div>

            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm cursor-pointer shadow-xs">
                دخول إلى لوحة التحكم
            </button>
        </form>

        <div id="error-msg" class="text-center text-xs font-bold text-rose-600 hidden bg-rose-50 p-2 rounded-xl border border-rose-100"></div>

    </div>

    <script>
        // تكوين إعدادات سوبابيس (تأكد من مطابقة المفاتيح في الملفين)
        const SUPABASE_URL = "https://dpyshuhinqruhaqftydkl.supabase.co";
        const SUPABASE_ANON_KEY = "ضع_مفتاح_ANON_الخاص_بمشروعك_هنا"; 
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // معالجة إرسال البيانات والتحقق من الصلاحية
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerText = "جاري التحقق من الحساب...";

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.innerText = "بيانات الدخول خاطئة: " + error.message;
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerText = "دخول إلى لوحة التحكم";
            } else {
                errorMsg.className = "text-center text-xs font-bold text-emerald-600 bg-emerald-50 p-2 rounded-xl border border-emerald-100";
                errorMsg.innerText = "تم التحقق بنجاح! جاري تحويلك للوحة...";
                errorMsg.classList.remove('hidden');
                
                setTimeout(() => {
                    window.location.href = "index.html"; // التوجيه لصفحة اللوحة الرئيسية
                }, 1000);
            }
        });
    </script>
</body>
</html>
